<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Velkor Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #f3f4f6;
        }

        /* ---------------- LOGIN ---------------- */

        #loginView {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 360px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 32px;
        }

        .login-card h1 {
            margin-top: 0;
            font-size: 26px;
        }

        .login-card h1 span {
            color: #2563eb;
        }

        .login-card p.subtitle {
            color: #9ca3af;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        input, select, textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #f3f4f6;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
            font-family: inherit;
        }

        label {
            font-size: 11px;
            color: #9ca3af;
            display: block;
            margin-bottom: 4px;
        }

        button {
            cursor: pointer;
            font-family: inherit;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.15s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #2563eb; color: white; width: 100%; }
        .btn-secondary { background: #374151; color: #f3f4f6; }
        .btn-danger { background: #7f1d1d; color: #fecaca; }
        .btn-green { background: #14532d; color: #bbf7d0; }
        .btn-small { padding: 6px 10px; font-size: 11px; }

        .error-banner {
            background: rgba(239,68,68,0.12);
            color: #f87171;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }

        /* ---------------- APP SHELL ---------------- */

        #appView { display: none; height: 100vh; flex-direction: column; }

        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }

        #topbar .brand { font-size: 20px; font-weight: 800; }
        #topbar .brand span { color: #2563eb; }

        #tabs { display: flex; gap: 6px; }

        .tab-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        .tab-btn.active { background: #1f2937; color: #f3f4f6; font-weight: bold; }

        #mainArea { flex: 1; display: flex; overflow: hidden; padding: 14px; gap: 14px; }

        .panel {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 16px;
            overflow-y: auto;
        }

        .tab-content { display: none; flex: 1; gap: 14px; overflow: hidden; }
        .tab-content.active { display: flex; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; padding: 8px; background: #1f2937; border-bottom: 1px solid #374151; }
        td { font-size: 12px; padding: 8px; border-bottom: 1px solid #1f2937; }
        tr:hover { background: #1f2937; cursor: pointer; }
        .selected-row { background: #1e3a8a !important; }

        .status-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: bold;
        }
        .status-active, .status-arrived { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-pending { background: rgba(234,179,8,0.15); color: #eab308; }
        .status-completed { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .status-disabled { background: rgba(239,68,68,0.15); color: #ef4444; }

        #map { width: 100%; height: 100%; border-radius: 14px; overflow: hidden; }

        .empty { font-size: 12px; color: #9ca3af; padding: 10px 0; }

        .stop-row-form {
            display: grid;
            grid-template-columns: 1fr 1fr 80px 80px 30px;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }

        .stop-row-form input { margin-bottom: 0; }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .summary-item { background: #1f2937; border-radius: 10px; padding: 10px; }
        .summary-label { font-size: 10px; color: #9ca3af; }
        .summary-value { font-size: 15px; font-weight: bold; }

        .section-title { font-size: 14px; font-weight: bold; margin: 18px 0 8px; }
        .filters { display: flex; gap: 8px; margin-bottom: 10px; }
        .filters select, .filters input { margin-bottom: 0; }
    </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
    <div class="login-card">
        <h1><span>Velkor</span></h1>
        <p class="subtitle">Manager sign in</p>

        <div class="error-banner" id="loginError"></div>

        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@company.com" />

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />

        <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
    </div>
</div>

<!-- ================= APP ================= -->
<div id="appView">

    <div id="topbar">
        <div class="brand"><span>Velkor</span> Dashboard</div>

        <div id="tabs">
            <button class="tab-btn active" data-tab="live" onclick="switchTab('live')">Live</button>
            <button class="tab-btn" data-tab="workers" onclick="switchTab('workers')">Workers</button>
            <button class="tab-btn" data-tab="routes" onclick="switchTab('routes')">Routes</button>
        </div>

        <button class="btn btn-secondary btn-small" onclick="doLogout()">Log out</button>
    </div>

    <div id="mainArea">

        <!-- ---------------- LIVE TAB ---------------- -->
        <div class="tab-content active" id="tab-live">
            <div class="panel" style="width:380px; flex-shrink:0;">
                <div class="section-title">Active Routes</div>
                <div id="liveList"></div>
            </div>
            <div class="panel" style="flex:1;">
                <div id="map"></div>
            </div>
        </div>

        <!-- ---------------- WORKERS TAB ---------------- -->
        <div class="tab-content" id="tab-workers">
            <div class="panel" style="width:340px; flex-shrink:0;">
                <div class="section-title">Add Worker</div>
                <div class="error-banner" id="workerFormError"></div>
                <label>Worker ID (login)</label>
                <input id="newWorkerCode" placeholder="e.g. jsmith" />
                <label>Name</label>
                <input id="newWorkerName" placeholder="Jane Smith" />
                <label>PIN (4-8 digits)</label>
                <input id="newWorkerPin" placeholder="1234" />
                <button class="btn btn-primary" onclick="createWorker()">Create Worker</button>
            </div>
            <div class="panel" style="flex:1;">
                <div class="section-title">Workers</div>
                <table id="workersTable"></table>
            </div>
        </div>

        <!-- ---------------- ROUTES TAB ---------------- -->
        <div class="tab-content" id="tab-routes">
            <div class="panel" style="width:400px; flex-shrink:0;">
                <div class="section-title">Create Route</div>
                <div class="error-banner" id="routeFormError"></div>

                <label>Worker</label>
                <select id="newRouteWorker"></select>

                <label>Route Name (optional)</label>
                <input id="newRouteName" placeholder="e.g. North Loop" />

                <label>Date</label>
                <input type="date" id="newRouteDate" />

                <div class="section-title" style="margin-top:16px;">Stops</div>
                <div id="stopRows"></div>
                <button class="btn btn-secondary btn-small" onclick="addStopRow()">+ Add Stop</button>

                <div style="margin-top:16px;">
                    <button class="btn btn-primary" onclick="createRoute()">Create Route</button>
                </div>
            </div>

            <div class="panel" style="width:340px; flex-shrink:0;">
                <div class="section-title">Route History</div>

                <div class="filters">
                    <select id="filterWorker"><option value="">All workers</option></select>
                    <select id="filterStatus">
                        <option value="">All status</option>
                        <option value="pending">Pending</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <button class="btn btn-secondary btn-small" style="margin-bottom:10px;" onclick="loadRoutesList()">Refresh</button>

                <table id="routesTable"></table>
            </div>

            <div class="panel" style="flex:1;">
                <div id="routeDetail" class="empty">Select a route to see details.</div>
            </div>
        </div>

    </div>
</div>

<script>
    // ---------------- CONFIG / AUTH ----------------

    const BASE_URL = window.location.origin;
    const TOKEN_KEY = 'velkor_manager_token';

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    async function apiFetch(path, options = {}) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;

        const res = await fetch(`${BASE_URL}${path}`, Object.assign({}, options, { headers }));

        if (res.status === 401) {
            clearToken();
            showLogin();
            throw new Error('Session expired, please log in again');
        }

        let body = null;
        try { body = await res.json(); } catch (_) {}

        if (!res.ok) {
            throw new Error((body && body.error) || `Request failed (${res.status})`);
        }

        return body;
    }

    function showLogin() {
        document.getElementById('loginView').style.display = 'flex';
        document.getElementById('appView').style.display = 'none';
    }

    function showApp() {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('appView').style.display = 'flex';
        initApp();
    }

    async function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        errEl.style.display = 'none';

        try {
            const data = await apiFetch('/auth/manager/login', {
                method: 'POST',
                body: JSON.stringify({ email, password }),
            });

            setToken(data.token);
            showApp();
        } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        }
    }

    async function doLogout() {
        try {
            await apiFetch('/auth/manager/logout', { method: 'POST' });
        } catch (_) {}
        clearToken();
        showLogin();
    }

    // ---------------- TABS ----------------

    let appInitialized = false;

    function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${name}`));

        if (name === 'live') loadLive();
        if (name === 'workers') loadWorkers();
        if (name === 'routes') { loadWorkersForSelects(); loadRoutesList(); }
    }

    function initApp() {
        if (appInitialized) { switchTab('live'); return; }
        appInitialized = true;

        map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        document.getElementById('newRouteDate').value = new Date().toISOString().slice(0, 10);
        addStopRow();

        loadLive();
        setInterval(() => {
            const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
            if (activeTab === 'live') loadLive();
        }, 30000);
    }

    // ---------------- LIVE TAB ----------------

    let map;
    let liveMarkers = [];

    function clearLiveMarkers() {
        liveMarkers.forEach(m => map.removeLayer(m));
        liveMarkers = [];
    }

    async function loadLive() {
        try {
            const routes = await apiFetch('/admin/routes/live');
            const list = document.getElementById('liveList');

            clearLiveMarkers();

            if (!routes.length) {
                list.innerHTML = '<div class="empty">No active routes right now</div>';
                return;
            }

            list.innerHTML = '';
            const bounds = [];

            routes.forEach(r => {
                const div = document.createElement('div');
                div.style.cssText = 'background:#1f2937;border-radius:10px;padding:12px;margin-bottom:10px;';

                div.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <strong>${r.workerName || r.workerId}</strong>
                        <span class="status-pill ${r.online ? 'status-active' : 'status-disabled'}">${r.online ? 'ONLINE' : 'OFFLINE'}</span>
                    </div>
                    <div style="font-size:11px;color:#9ca3af;margin-top:4px;">${r.routeName || 'Unnamed route'}</div>
                    <div style="font-size:11px;margin-top:8px;">
                        Progress: ${r.completedStopCount}/${r.totalStopCount} stops
                    </div>
                    <div style="font-size:11px;color:#9ca3af;">
                        Current: ${r.currentStop ? r.currentStop.customerName : '—'}
                    </div>
                    <div style="font-size:11px;color:#9ca3af;">
                        Next: ${r.nextStop ? r.nextStop.customerName : '—'}
                    </div>
                    <div style="font-size:10px;color:#6b7280;margin-top:6px;">
                        Last update: ${r.lastUpdate ? new Date(r.lastUpdate).toLocaleTimeString() : 'no pings yet'}
                    </div>
                `;

                list.appendChild(div);

                if (r.lastLocation) {
                    const marker = L.circleMarker([r.lastLocation.lat, r.lastLocation.lng], {
                        radius: 8,
                        color: r.online ? '#22c55e' : '#6b7280',
                        fillColor: r.online ? '#22c55e' : '#6b7280',
                        fillOpacity: 1,
                    }).addTo(map).bindPopup(`${r.workerName || r.workerId}`);

                    liveMarkers.push(marker);
                    bounds.push([r.lastLocation.lat, r.lastLocation.lng]);
                }
            });

            if (bounds.length) map.fitBounds(bounds, { padding: [40, 40] });

        } catch (e) {
            console.error(e);
        }
    }

    // ---------------- WORKERS TAB ----------------

    async function loadWorkers() {
        try {
            const workers = await apiFetch('/admin/workers');
            const table = document.getElementById('workersTable');

            table.innerHTML = `
                <tr><th>Worker ID</th><th>Name</th><th>Status</th><th></th></tr>
            `;

            if (!workers.length) {
                table.innerHTML += `<tr><td colspan="4" class="empty">No workers yet</td></tr>`;
                return;
            }

            workers.forEach(w => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${w.workerCode}</td>
                    <td>${w.name}</td>
                    <td><span class="status-pill status-${w.status === 'active' ? 'active' : 'disabled'}">${w.status.toUpperCase()}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-small btn-secondary" onclick="resetWorkerPin('${w.id}')">Reset PIN</button>
                        <button class="btn btn-small ${w.status === 'active' ? 'btn-danger' : 'btn-green'}" onclick="toggleWorkerStatus('${w.id}', '${w.status}')">
                            ${w.status === 'active' ? 'Disable' : 'Enable'}
                        </button>
                    </td>
                `;
                table.appendChild(row);
            });
        } catch (e) {
            console.error(e);
        }
    }

    async function createWorker() {
        const errEl = document.getElementById('workerFormError');
        errEl.style.display = 'none';

        const workerCode = document.getElementById('newWorkerCode').value.trim();
        const name = document.getElementById('newWorkerName').value.trim();
        const pin = document.getElementById('newWorkerPin').value.trim();

        try {
            await apiFetch('/admin/workers', {
                method: 'POST',
                body: JSON.stringify({ workerCode, name, pin }),
            });

            document.getElementById('newWorkerCode').value = '';
            document.getElementById('newWorkerName').value = '';
            document.getElementById('newWorkerPin').value = '';

            loadWorkers();
        } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        }
    }

    async function toggleWorkerStatus(id, currentStatus) {
        const next = currentStatus === 'active' ? 'disabled' : 'active';
        try {
            await apiFetch(`/admin/workers/${id}/status`, {
                method: 'PATCH',
                body: JSON.stringify({ status: next }),
            });
            loadWorkers();
        } catch (e) {
            alert(e.message);
        }
    }

    async function resetWorkerPin(id) {
        const pin = prompt('New PIN (4-8 digits):');
        if (!pin) return;

        try {
            await apiFetch(`/admin/workers/${id}/reset-pin`, {
                method: 'POST',
                body: JSON.stringify({ pin }),
            });
            alert('PIN updated');
        } catch (e) {
            alert(e.message);
        }
    }

    // ---------------- ROUTES TAB: create route ----------------

    let stopRowCount = 0;

    function addStopRow() {
        stopRowCount++;
        const container = document.getElementById('stopRows');
        const row = document.createElement('div');
        row.className = 'stop-row-form';
        row.dataset.rowId = stopRowCount;

        row.innerHTML = `
            <input placeholder="Customer name" class="stop-name" />
            <input placeholder="Address (optional)" class="stop-address" />
            <input placeholder="Lat" class="stop-lat" />
            <input placeholder="Lng" class="stop-lng" />
            <button class="btn btn-small btn-danger" style="padding:6px;" onclick="this.parentElement.remove()">×</button>
        `;

        container.appendChild(row);
    }

    async function loadWorkersForSelects() {
        try {
            const workers = await apiFetch('/admin/workers');
            const activeWorkers = workers.filter(w => w.status === 'active');

            const routeSelect = document.getElementById('newRouteWorker');
            const filterSelect = document.getElementById('filterWorker');

            routeSelect.innerHTML = activeWorkers.map(w => `<option value="${w.id}">${w.name} (${w.workerCode})</option>`).join('');
            filterSelect.innerHTML = '<option value="">All workers</option>' +
                workers.map(w => `<option value="${w.id}">${w.name} (${w.workerCode})</option>`).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function createRoute() {
        const errEl = document.getElementById('routeFormError');
        errEl.style.display = 'none';

        const workerId = document.getElementById('newRouteWorker').value;
        const name = document.getElementById('newRouteName').value.trim();
        const routeDate = document.getElementById('newRouteDate').value;

        const stopRows = document.querySelectorAll('#stopRows .stop-row-form');
        const stops = Array.from(stopRows).map(row => ({
            customerName: row.querySelector('.stop-name').value.trim(),
            address: row.querySelector('.stop-address').value.trim(),
            lat: parseFloat(row.querySelector('.stop-lat').value),
            lng: parseFloat(row.querySelector('.stop-lng').value),
        })).filter(s => s.customerName && !isNaN(s.lat) && !isNaN(s.lng));

        if (!workerId) { errEl.textContent = 'Add a worker first (Workers tab)'; errEl.style.display = 'block'; return; }
        if (!stops.length) { errEl.textContent = 'Add at least one valid stop (name, lat, lng)'; errEl.style.display = 'block'; return; }

        try {
            await apiFetch('/admin/routes', {
                method: 'POST',
                body: JSON.stringify({ workerId, name, routeDate, stops }),
            });

            document.getElementById('newRouteName').value = '';
            document.getElementById('stopRows').innerHTML = '';
            addStopRow();

            loadRoutesList();
        } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        }
    }

    // ---------------- ROUTES TAB: history + detail ----------------

    async function loadRoutesList() {
        try {
            const workerId = document.getElementById('filterWorker').value;
            const status = document.getElementById('filterStatus').value;

            let query = [];
            if (workerId) query.push(`workerId=${workerId}`);
            if (status) query.push(`status=${status}`);

            const routes = await apiFetch(`/admin/routes${query.length ? '?' + query.join('&') : ''}`);
            const table = document.getElementById('routesTable');

            table.innerHTML = `<tr><th>Date</th><th>Status</th><th>Progress</th></tr>`;

            if (!routes.length) {
                table.innerHTML += `<tr><td colspan="3" class="empty">No routes found</td></tr>`;
                return;
            }

            routes.forEach(r => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${r.routeDate}</td>
                    <td><span class="status-pill status-${r.status}">${r.status.toUpperCase()}</span></td>
                    <td>${r.completedStopCount}/${r.totalStopCount}</td>
                `;
                row.onclick = () => {
                    document.querySelectorAll('#routesTable tr').forEach(tr => tr.classList.remove('selected-row'));
                    row.classList.add('selected-row');
                    loadRouteDetail(r.id);
                };
                table.appendChild(row);
            });
        } catch (e) {
            console.error(e);
        }
    }

    let selectedRouteSummary = null;
    let selectedRouteLogs = [];

    async function loadRouteDetail(routeId) {
        try {
            const [route, summary, logs] = await Promise.all([
                apiFetch(`/admin/routes/${routeId}`),
                apiFetch(`/admin/routes/${routeId}/summary`),
                apiFetch(`/admin/routes/${routeId}/logs`),
            ]);

            selectedRouteSummary = summary;
            selectedRouteLogs = logs;

            const el = document.getElementById('routeDetail');

            const stopsHtml = route.stops.map((s, i) => `
                <div style="background:#1f2937;border-radius:10px;padding:10px;margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;">
                        <strong>${i + 1}. ${s.customerName}</strong>
                        <span class="status-pill status-${s.status === 'skipped' ? 'disabled' : s.status}">${s.status.toUpperCase()}</span>
                    </div>
                    <div style="font-size:11px;color:#9ca3af;">${s.address || ''}</div>
                    <div style="font-size:11px;color:#6b7280;margin-top:4px;">
                        ${s.arrivedAt ? 'Arrived: ' + new Date(s.arrivedAt).toLocaleTimeString() : ''}
                        ${s.departedAt ? ' · Departed: ' + new Date(s.departedAt).toLocaleTimeString() : ''}
                        ${s.manualOverride ? ' · (manual override)' : ''}
                    </div>
                </div>
            `).join('');

            el.innerHTML = `
                <div class="section-title">${route.name || 'Route'} — ${route.routeDate}</div>

                <div class="summary-grid">
                    <div class="summary-item"><div class="summary-label">Worker</div><div class="summary-value">${summary.workerName || summary.workerId}</div></div>
                    <div class="summary-item"><div class="summary-label">Duration</div><div class="summary-value">${formatDuration(summary.durationMs)}</div></div>
                    <div class="summary-item"><div class="summary-label">Distance</div><div class="summary-value">${(summary.distanceMeters / 1000).toFixed(2)} km</div></div>
                    <div class="summary-item"><div class="summary-label">Stops</div><div class="summary-value">${summary.completedStops}/${summary.totalStops}</div></div>
                </div>

                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <button class="btn btn-secondary btn-small" onclick="exportRouteCSV()">Export CSV</button>
                    <button class="btn btn-secondary btn-small" onclick="exportRoutePDF()">Export PDF</button>
                </div>

                <div id="routeDetailMap" style="height:260px; border-radius:12px; overflow:hidden; margin-bottom:14px;"></div>

                <div class="section-title">Stops</div>
                ${stopsHtml}
            `;

            renderRouteDetailMap(route.stops, logs);
        } catch (e) {
            console.error(e);
            alert('Failed to load route: ' + e.message);
        }
    }

    let detailMap = null;

    function renderRouteDetailMap(stops, logs) {
        if (detailMap) { detailMap.remove(); detailMap = null; }

        detailMap = L.map('routeDetailMap').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(detailMap);

        const bounds = [];

        if (logs.length) {
            const latlngs = logs.map(l => [l.lat, l.lng]);
            L.polyline(latlngs, { color: '#3b82f6', weight: 4 }).addTo(detailMap);
            latlngs.forEach(ll => bounds.push(ll));
        }

        stops.forEach((s, i) => {
            const color = s.status === 'completed' ? '#22c55e' : s.status === 'skipped' ? '#ef4444' : '#eab308';
            L.circleMarker([s.lat, s.lng], { radius: 7, color, fillColor: color, fillOpacity: 1 })
                .addTo(detailMap)
                .bindPopup(`${i + 1}. ${s.customerName}`);
            bounds.push([s.lat, s.lng]);
        });

        if (bounds.length) detailMap.fitBounds(bounds, { padding: [30, 30] });
    }

    function formatDuration(ms) {
        if (!ms) return '—';
        const minutes = Math.floor(ms / 60000);
        if (minutes < 60) return `${minutes} min`;
        const hours = Math.floor(minutes / 60);
        return `${hours}h ${minutes % 60}m`;
    }

    // ---------------- EXPORTS ----------------

    function exportRouteCSV() {
        if (!selectedRouteLogs.length) { alert('No GPS logs for this route'); return; }

        let csv = 'Time,Latitude,Longitude\n';
        selectedRouteLogs.forEach(log => {
            csv += `${new Date(log.timestamp).toLocaleString()},${log.lat},${log.lng}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'velkor_route_logs.csv';
        a.click();
        URL.revokeObjectURL(url);
    }

    function exportRoutePDF() {
        if (!selectedRouteSummary) { alert('No route selected'); return; }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = selectedRouteSummary;

        doc.setFontSize(22);
        doc.text('VELKOR ROUTE REPORT', 20, 25);

        doc.setFontSize(11);
        doc.setTextColor(120);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 34);

        doc.setDrawColor(220);
        doc.roundedRect(15, 45, 180, 70, 4, 4);

        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text('Route Summary', 20, 58);

        doc.setFontSize(12);
        doc.text(`Worker: ${s.workerName || s.workerId}`, 20, 72);
        doc.text(`Stops completed: ${s.completedStops}/${s.totalStops}`, 20, 84);
        doc.text(`Duration: ${formatDuration(s.durationMs)}`, 20, 96);
        doc.text(`Distance: ${(s.distanceMeters / 1000).toFixed(2)} km`, 20, 108);

        doc.setFontSize(14);
        doc.text('Stops', 20, 132);

        let y = 145;
        doc.setFontSize(10);

        s.stops.forEach((stop, i) => {
            if (y > 270) { doc.addPage(); y = 20; }

            const line = `${i + 1}. ${stop.customerName} — ${stop.status.toUpperCase()}` +
                (stop.arrivedAt ? ` | arrived ${new Date(stop.arrivedAt).toLocaleTimeString()}` : '') +
                (stop.departedAt ? ` | departed ${new Date(stop.departedAt).toLocaleTimeString()}` : '');

            doc.text(line, 20, y);
            y += 8;
        });

        doc.save('velkor_route_report.pdf');
    }

    // ---------------- INIT ----------------

    if (getToken()) {
        showApp();
    } else {
        showLogin();
    }
</script>

</body>
</html>
