name: traki
description: Velkor field worker app - route-based visit tracking
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.1

  # GPS
  geolocator: ^11.0.0

  # Optional (for sharing link later)
  share_plus: ^7.2.1

  #shared preferences
  shared_preferences: ^2.2.2

  #wake lock
  wakelock_plus: ^1.2.5

  # Open the device's maps app for turn-by-turn navigation to a stop
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
